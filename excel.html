 solid var(--line);background:var(--panel);color:var(--text);border-radius:3px;padding:3px}.formula-wrap{height:35px;background:var(--panel);display:flex;border-bottom:1px solid var(--line);align-items:center;gap:5px;padding:4px 8px}.namebox{width:80px}.fx{font-style:italic;font-weight:700;color:var(--green)}#formula{flex:1}.workspace{flex:1;min-height:0;display:flex;position:relative}.grid-wrap{flex:1;min-width:0;overflow:auto;background:var(--panel);position:relative;zoom:var(--scale);outline:none}table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content}.col-resizer{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;touch-action:none;z-index:8}.row-resizer{position:absolute;bottom:0;left:0;right:0;height:7px;cursor:row-resize;touch-action:none;z-index:8}.sheet th.header-selected{background:var(--select);color:var(--green);font-weight:bold}.resize-guide{position:fixed;z-index:100;background:var(--green);pointer-events:none}.cf-rule{padding:8px;border:1px solid var(--line);border-radius:5px;margin:7px 0;display:flex;gap:8px;align-items:center}.cf-rule span{flex:1}.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:24px;min-height:24px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel);position:relative}.sheet th{background:var(--head);font-weight:500;text-align:center;position:sticky;z-index:3}.sheet thead th{top:0}.sheet .rowh{left:0;z-index:2;width:46px;min-width:46px}.sheet thead .rowh{z-index:5}.sheet td{width:100px;min-width:100px;}.sheet td.selected{outline:2px solid var(--sel);outline-offset:-2px;background:var(--select);z-index:1}.sheet td.range{background:var(--select)}.sheet td.editing{padding:0;overflow:visible}.sheet td input.editor{width:100%;height:100%;border:2px solid var(--sel);outline:0;background:var(--panel);color:var(--text);padding:2px 4px}.fill-handle{position:absolute;width:8px;height:8px;background:var(--sel);right:-2px;bottom:-2px;z-index:5;cursor:crosshair}.fill-preview{background:#c8ead6!important;outline:1px dashed var(--sel)}.nogrid td,.nogrid th{border-color:transparent}.sheets{height:34px;background:var(--head);border-top:1px solid var(--line);display:flex;align-items:center;padding:3px 8px;gap:3px;overflow-x:auto}.sheet-tab{padding:6px 13px;background:var(--panel);border:1px solid var(--line);border-radius:4px 4px 0 0;white-space:nowrap}.sheet-tab.active{color:var(--green);border-bottom:2px solid var(--green);font-weight:600}.status{height:25px;background:var(--green);color:white;display:flex;align-items:center;gap:15px;padding:0 10px}.status .right{margin-left:auto}.panel{width:330px;background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;padding:12px;overflow:auto}.panel.open{display:flex}.panel h3{margin:0 0 10px}.modal-bg{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50}.modal-bg.show{display:grid}.modal{width:min(600px,94vw);max-height:82vh;overflow:auto;background:var(--panel);padding:18px;border-radius:10px;box-shadow:var(--shadow)}.modal h2{margin-top:0}.form-row{display:flex;gap:8px;margin:8px 0;align-items:center}.form-row label{width:120px}.form-row input,.form-row select,.modal textarea{flex:1;padding:7px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:4px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.primary{background:var(--green)!important;color:#fff!important;padding:7px 13px!important}.danger{background:#b3261e!important;color:#fff!important;padding:7px 13px!important}.toast{position:fixed;right:14px;bottom:62px;background:#252a27;color:#fff;padding:10px 14px;border-radius:6px;z-index:90;box-shadow:var(--shadow);display:none}.chartbox{position:absolute;left:80px;top:40px;width:520px;height:320px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);z-index:10;padding:28px 8px 8px; /* Pastel dimensional controls: embedded CSS, no external icon dependency. */
:root{--icon-top:#f4fff8;--icon-bottom:#b9e4cb;--icon-ink:#246443;--icon-edge:#8fc4a6}
.tool{height:60px;min-width:58px;gap:4px;padding:3px 5px;transition:transform .15s ease,background .15s ease}
.tool b,.icon-3d{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:3px 5px;border-radius:10px;color:var(--icon-ink);background:linear-gradient(145deg,var(--icon-top),var(--icon-bottom));border:1px solid #ffffffb0;box-shadow:inset 1px 2px 2px #ffffffd9,inset -2px -2px 3px #00000012,0 3px 0 var(--icon-edge),0 5px 8px #23412f22;text-shadow:0 1px 0 #fff9;font-size:17px;font-weight:700;line-height:1;transition:transform .15s,box-shadow .15s}
.tool:nth-child(6n+2),button[data-act="undo"],button[data-act="zoom-in"]{--icon-top:#f4faff;--icon-bottom:#bedcf5;--icon-ink:#345f85;--icon-edge:#9bbddc}
.tool:nth-child(6n+3),button[data-act="redo"],button[data-act="zoom-out"]{--icon-top:#fff8fc;--icon-bottom:#f1c8df;--icon-ink:#8a4b70;--icon-edge:#d5a6c0}
.tool:nth-child(6n+4),button[data-act="fullscreen"]{--icon-top:#fffdf1;--icon-bottom:#f2e3a8;--icon-ink:#816b2d;--icon-edge:#d6c68b}
.tool:nth-child(6n+5),button[data-act="theme"]{--icon-top:#faf7ff;--icon-bottom:#d9ccf5;--icon-ink:#665087;--icon-edge:#b8a5d8}
.tool:nth-child(6n),button[data-act="new"]{--icon-top:#fff9f2;--icon-bottom:#f4d1b5;--icon-ink:#8b603b;--icon-edge:#d9b395}
.tool:hover b,button:hover>.icon-3d{transform:translateY(-2px);box-shadow:inset 1px 2px 2px #ffffffd9,0 5px 0 var(--icon-edge),0 8px 12px #23412f25}
.tool:active b,button:active>.icon-3d{transform:translateY(2px);box-shadow:inset 1px 2px 2px #ffffffa0,0 1px 0 var(--icon-edge)}
.tool small{font-size:10px;white-space:nowrap}.titlebar{height:50px;flex-shrink:0}.titlebar button{display:inline-flex;align-items:center;gap:6px;padding:3px 5px}.titlebar .icon-3d{min-width:26px;height:26px;font-size:15px;border-radius:8px}.status{height:34px;flex-shrink:0}.status .icon-3d,.sheets .icon-3d{height:22px;min-width:22px;font-size:13px;border-radius:6px}.status button{display:inline-flex;align-items:center;gap:4px}.logo{background:linear-gradient(145deg,#fff,#c5ead7);box-shadow:inset 1px 2px 2px #fff,0 3px 0 #80b899,0 5px 8px #0002;transform:rotate(-3deg)}
.dark .tool small{color:#e5ece8}.dark .tool:hover{background:#ffffff12}
@media(max-width:700px){.titlebar{height:auto;min-height:50px;flex-wrap:wrap}.titlebar .save-state{width:100%;order:10;font-size:10px}.tool{min-width:42px;height:52px}.tool b{height:30px;min-width:30px}.status{height:auto;min-height:34px;flex-wrap:wrap;padding:4px 8px}.status .right{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.titlebar strong{font-size:12px}}


/* Grouped Home ribbon and explicit color controls */
.ribbon.home-ribbon{height:116px;min-height:116px;align-items:stretch;gap:8px;padding:7px 8px;overflow-x:auto;overflow-y:hidden}
.home-group{position:relative;flex:0 0 auto;display:flex;flex-direction:column;min-width:110px;border-right:1px solid var(--line);padding:0 8px 0 0}
.home-group-content{display:flex;gap:3px;align-items:center;flex:1}.home-group-label{text-align:center;font-size:11px;color:var(--text);opacity:.8;padding:4px 0;border-top:1px solid var(--line)}
.home-group .tool{min-width:43px;height:59px;padding:2px}.home-group .tool b{height:28px;min-width:28px;font-size:14px;border-radius:8px}.home-group .tool small{font-size:9px}.font-controls{display:flex;flex-direction:column;gap:5px;max-width:160px}.font-controls .tool-input{max-width:150px}.home-more{height:35px;border:1px solid var(--line);background:var(--head);padding:4px 9px;white-space:nowrap}
.color-swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}.color-swatch{height:30px;border:1px solid #888;border-radius:5px;box-shadow:inset 0 1px 2px #fff8,0 2px 3px #0002}.color-swatch:hover{outline:2px solid var(--green)}
.sheet td.selected,.sheet td.range{background-color:var(--select)}.sheet td.selected{outline:2px solid var(--sel);outline-offset:-2px}
@media(max-width:700px){.ribbon.home-ribbon{height:103px;min-height:103px}.home-group .tool small{display:block}.home-group .tool{height:51px}.home-group{min-width:90px}}

<body>
<div class="app" id="app">
<header class="titlebar"><div class="logo">X</div><strong>Excel Pro</strong><input id="filename" class="file" value="Workbook1"><button data-act="new"><span class="icon-3d">＋</span> नया</button><button data-act="undo" title="Ctrl+Z"><span class="icon-3d">↶</span></button><button data-act="redo" title="Ctrl+Y"><span class="icon-3d">↷</span></button><span class="save-state" id="saveState">अस्थायी सत्र: Refresh पर खाली शीट</span><input id="search" class="search" placeholder="खोजें (Ctrl+F)"><button data-act="save"><span class="icon-3d">💾</span> Save XLSX</button><button data-act="fullscreen"><span class="icon-3d">⛶</span></button><button data-act="theme"><span class="icon-3d">◐</span></button></header>
<nav class="tabs" id="tabs"></nav><section class="ribbon" id="ribbon"></section>
<div class="formula-wrap" id="formulaWrap"><input class="tool-input namebox" id="namebox" value="A1"><span class="fx">fx</span><input class="tool-input" id="formula" list="functions" placeholder="मान या =फ़ॉर्मूला"><datalist id="functions"></datalist><button data-act="wizard"><span class="icon-3d">ƒx</span></button></div>

</div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.json" hidden><input type="file" id="imageInput" accept="image/*" hidden>
<div class="formula-suggest" id="formulaSuggest"></div><div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
let ROWS=100,COLS=26; const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const addr=(r,c)=>colName(c)+(r+1); const parseAddr=a=>{let m=String(a).toUpperCase().match(/^\$?([A-Z]+)\$?(\d+)$/);if(!m)return null;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return {r:+m[2]-1,c:c-1}};

let headerSelection=null;let selection={r1:0,c1:0,r2:0,c2:0},anchor={r:0,c:0},history=[],future=[],clip=null,dirty=false,hf=null,sid=0,editing=false;
const FN_INFO={SUM:['Math','SUM(number1, [number2], ...)','संख्याओं का योग'],AVERAGE:['Statistical','AVERAGE(number1, ...)','औसत'],COUNT:['Statistical','COUNT(value1, ...)','संख्यात्मक मानों की गिनती'],COUNTA:['Statistical','COUNTA(value1, ...)','गैर-खाली मानों की गिनती'],MAX:['Statistical','MAX(number1, ...)','सबसे बड़ा मान'],MIN:['Statistical','MIN(number1, ...)','सबसे छोटा मान'],IF:['Logical','IF(test, value_if_true, value_if_false)','शर्त के अनुसार परिणाम'],AND:['Logical','AND(logical1, ...)','सभी शर्तें सही'],OR:['Logical','OR(logical1, ...)','कोई शर्त सही'],NOT:['Logical','NOT(logical)','तार्किक उलट'],IFERROR:['Logical','IFERROR(value, value_if_error)','त्रुटि पर वैकल्पिक मान'],ROUND:['Math','ROUND(number, num_digits)','दशमलव तक राउंड'],ABS:['Math','ABS(number)','परम मान'],SQRT:['Math','SQRT(number)','वर्गमूल'],POWER:['Math','POWER(number, power)','घात'],PRODUCT:['Math','PRODUCT(number1, ...)','गुणनफल'],MOD:['Math','MOD(number, divisor)','शेषफल'],CONCAT:['Text','CONCAT(text1, ...)','टेक्स्ट जोड़ता है'],LEFT:['Text','LEFT(text, [num_chars])','बाएँ अक्षर'],RIGHT:['Text','RIGHT(text, [num_chars])','दाएँ अक्षर'],MID:['Text','MID(text,start,num_chars)','बीच के अक्षर'],LEN:['Text','LEN(text)','लंबाई'],UPPER:['Text','UPPER(text)','बड़े अक्षर'],LOWER:['Text','LOWER(text)','छोटे अक्षर'],TRIM:['Text','TRIM(text)','अतिरिक्त स्पेस हटाता है'],TODAY:['Date','TODAY()','आज की तारीख'],NOW:['Date','NOW()','वर्तमान तारीख/समय'],DATE:['Date','DATE(year,month,day)','तारीख'],DAY:['Date','DAY(serial)','दिन'],MONTH:['Date','MONTH(serial)','माह'],YEAR:['Date','YEAR(serial)','वर्ष'],VLOOKUP:['Lookup','VLOOKUP(value,table,index,[approx])','ऊर्ध्वाधर खोज'],HLOOKUP:['Lookup','HLOOKUP(value,table,index,[approx])','क्षैतिज खोज'],INDEX:['Lookup','INDEX(range,row,[column])','स्थिति से मान'],MATCH:['Lookup','MATCH(value,range,[type])','स्थिति खोज'],XLOOKUP:['Lookup','XLOOKUP(value,lookup,return,[not_found])','आधुनिक खोज'],COUNTIF:['Statistical','COUNTIF(range,criteria)','शर्त आधारित गिनती'],SUMIF:['Math','SUMIF(range,criteria,[sum_range])','शर्त आधारित योग'],SUMIFS:['Math','SUMIFS(sum_range,criteria_range,criteria,...)','बहु-शर्त योग'],AVERAGEIF:['Statistical','AVERAGEIF(range,criteria,[avg_range])','शर्त आधारित औसत'],ISNUMBER:['Information','ISNUMBER(value)','संख्या जाँच'],ISTEXT:['Information','ISTEXT(value)','टेक्स्ट जाँच'],ISBLANK:['Information','ISBLANK(value)','रिक्त जाँच'],PMT:['Financial','PMT(rate,nper,pv,[fv],[type])','किस्त'],FV:['Financial','FV(rate,nper,pmt,[pv],[type])','भविष्य मूल्य'],PV:['Financial','PV(rate,nper,pmt,[fv],[type])','वर्तमान मूल्य'],NPV:['Financial','NPV(rate,value1,...)','शुद्ध वर्तमान मूल्य'],IRR:['Financial','IRR(values,[guess])','आंतरिक प्रतिफल'],RANK:['Statistical','RANK(number,ref,[order])','रैंक'],STDEV:['Statistical','STDEV(number1,...)','नमूना मानक विचलन'],VAR:['Statistical','VAR(number1,...)','नमूना variance'],PI:['Math','PI()','पाई'],SIN:['Math','SIN(number)','साइन'],COS:['Math','COS(number)','कोसाइन'],TAN:['Math','TAN(number)','टैन्जेंट'],RANDBETWEEN:['Math','RANDBETWEEN(bottom,top)','यादृच्छिक पूर्णांक']};

function parseCSV(t){let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let ch=t[i];if(ch==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(ch===','&&!q){row.push(v);v=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(v);rows.push(row);row=[];v=''}else v+=ch}row.push(v);if(row.some(x=>x!==''))rows.push(row);return rows}

$('#ribbon').onchange=e=>{if(e.target.id==='font')applyStyle('font',e.target.value);if(e.target.id==='size')applyStyle('size',Number(e.target.value));if(e.target.id==='format')applyStyle('format',e.target.value);requestAnimationFrame(()=>{const g=$('#gridWrap');if(g&&!editing&&!formulaPicking())g.focus({preventScroll:true})})};$('#tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)showRibbon(b.dataset.tab)};document.onclick=e=>{let b=e.target.closest('[data-act]');if(b)action(b.dataset.act);let c=e.target.closest('[data-close-chart]');if(c){snapshot();sheet().charts=sheet().charts.filter(d=>d.id!==c.dataset.closeChart);mark();refreshCharts()}let im=e.target.closest('[data-remove-image]');if(im){snapshot();sheet().images.splice(+im.dataset.removeImage,1);mark();renderImages()}};

$('#grid').onmousedown=e=>{if(e.target.closest('select,input,button'))return;let td=e.target.closest('td[data-r]');if(!td)return;if(!formulaPicking())$('#gridWrap').focus({preventScroll:true});if(e.target.classList.contains('validation-arrow')&&!formulaPicking()){e.preventDefault();select(+td.dataset.r,+td.dataset.c);setTimeout(()=>openValidationEditor(+td.dataset.r,+td.dataset.c),0);return}e.preventDefault();let r=+td.dataset.r,c=+td.dataset.c;if(e.target.classList.contains('fill-handle')&&!formulaPicking()){let src=clone(selection),last={r,c};let move=ev=>{let t=ev.target.closest('td[data-r]');if(t){last={r:+t.dataset.r,c:+t.dataset.c};$$('.fill-preview').forEach(x=>x.classList.remove('fill-preview'));let rr1=Math.min(src.r1,src.r2,last.r),rr2=Math.max(src.r1,src.r2,last.r),cc1=Math.min(src.c1,src.c2,last.c),cc2=Math.max(src.c1,src.c2,last.c);$$('#grid td').forEach(x=>{let tr=+x.dataset.r,tc=+x.dataset.c;if(tr>=rr1&&tr<=rr2&&tc>=cc1&&tc<=cc2)x.classList.add('fill-preview')})}};document.addEventListener('mouseover',move);document.addEventListener('mouseup',()=>{document.removeEventListener('mouseover',move);fillRange(src,last)},{once:true});return}if(formulaPicking()){let first={r,c},ref=insertFormulaReference(r,c);if(!ref)return;let move=ev=>{let t=ev.target.closest('td[data-r]');if(t){let rr=+t.dataset.r,cc=+t.dataset.c,range=addr(first.r,first.c)+(rr===first.r&&cc===first.c?'':':'+addr(rr,cc));ref.input.value=ref.input.value.slice(0,ref.start)+range+ref.input.value.slice(ref.end);ref.end=ref.start+range.length;ref.input.setSelectionRange(ref.end,ref.end);if(ref.input.classList.contains('editor'))$('#formula').value=ref.input.value}};document.addEventListener('mouseover',move);document.addEventListener('mouseup',()=>{document.removeEventListener('mouseover',move);ref.input.focus();ref.input.setSelectionRange(ref.end,ref.end)},{once:true});return}select(r,c,e.shiftKey);let move=ev=>{let t=ev.target.closest('td[data-r]');if(t)select(+t.dataset.r,+t.dataset.c,true)};document.addEventListener('mouseover',move);document.addEventListener('mouseup',()=>document.removeEventListener('mouseover',move),{once:true})};
$('#grid').ondblclick=e=>{let resize=e.target.closest('[data-resize-col],[data-resize-row]');if(resize){let axis=resize.hasAttribute('data-resize-col')?'col':'row';autoFitDimension(axis,Number(axis==='col'?resize.dataset.resizeCol:resize.dataset.resizeRow));return}if(formulaPicking()){e.preventDefault();return}if(e.target.closest('select,input,button'))return;let td=e.target.closest('td[data-r]');if(td){let r=+td.dataset.r,c=+td.dataset.c;if(!openValidationEditor(r,c))editCell(r,c)}};
let suggestIndex=0,suggestList=[];function showFormulaSuggestions(){let input=$('#formula'),m=input.value.match(/^=([A-Z.]*)$/i),box=$('#formulaSuggest');if(!m){box.style.display='none';return}let q=m[1].toUpperCase();suggestList=Object.keys(FN_INFO).filter(n=>n.startsWith(q)).slice(0,12);if(!suggestList.length){box.style.display='none';return}let r=input.getBoundingClientRect();box.style.left=r.left+'px';box.style.top=r.bottom+'px';suggestIndex=0;box.innerHTML=suggestList.map((n,i)=>`<button data-formula-fn="${n}" class="${i===0?'active':''}"><b>${n}</b> — ${FN_INFO[n][2]}<br><small>${FN_INFO[n][1]}</small></button>`).join('');box.style.display='block'}function pickFormula(n){$('#formula').value='='+n+'(';$('#formula').focus();$('#formulaSuggest').style.display='none'}
$('#formula').oninput=showFormulaSuggestions;$('#formulaSuggest').onclick=e=>{let b=e.target.closest('[data-formula-fn]');if(b)pickFormula(b.dataset.formulaFn)};$('#formula').onkeydown=e=>{if($('#formulaSuggest').style.display==='block'&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();suggestIndex=(suggestIndex+(e.key==='ArrowDown'?1:-1)+suggestList.length)%suggestList.length;$$('#formulaSuggest button').forEach((b,i)=>b.classList.toggle('active',i===suggestIndex));return}if(e.key==='Tab'&&suggestList.length&&$('#formulaSuggest').style.display==='block'){e.preventDefault();pickFormula(suggestList[suggestIndex]);return}if(e.key==='Enter'){if($('#formulaSuggest').style.display==='block'&&suggestList.length){e.preventDefault();pickFormula(suggestList[suggestIndex]);return}setCell(selection.r2,selection.c2,e.target.value);select(selection.r2+1,selection.c2)}};$('#namebox').onkeydown=e=>{if(e.key==='Enter'){let p=parseAddr(e.target.value);if(p)select(p.r,p.c)}};
$('#sheetTabs').onclick=e=>{let t=e.target.closest('[data-sheet]');if(t){wb.active=+t.dataset.sheet;syncEngine();renderSheets();renderGrid()}};$('#sheetTabs').ondblclick=e=>{let t=e.target.closest('[data-sheet]');if(t){let n=prompt('नया नाम',sheet().name);if(n&& !wb.sheets.some(s=>s.name===n)){snapshot();wb.sheets[+t.dataset.sheet].name=n;afterLoad()}}};
$('#fileInput').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''};$('#imageInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{snapshot();sheet().images??=[];sheet().images.push({src:rd.result,left:80,top:45,width:360,height:240});mark();renderImages();toast('चित्र शीट में जोड़ दिया गया')};rd.readAsDataURL(f);e.target.value=''};
$('#filename').onchange=e=>{wb.name=e.target.value||'Workbook';mark()};$('#search').onkeydown=e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(String(computed(r,c)).toLowerCase().includes(q))return select(r,c)}};
document.addEventListener('keydown',e=>{if(editing||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;let k=e.key.toLowerCase();if(e.ctrlKey||e.metaKey){let map={c:'copy',x:'cut',v:'paste',z:'undo',y:'redo',s:'save',b:'bold',i:'italic',u:'underline'};if(map[k]){e.preventDefault();action(map[k])}if(k==='f'){e.preventDefault();$('#search').focus()}if(k==='h'){e.preventDefault();findReplace()}if(k==='a'){e.preventDefault();anchor={r:0,c:0};selection={r1:0,c1:0,r2:ROWS-1,c2:COLS-1};renderGrid()}return}let {r2:r,c2:c}=selection;if(k==='arrowup')select(r-1,c,e.shiftKey);else if(k==='arrowdown')select(r+1,c,e.shiftKey);else if(k==='arrowleft')select(r,c-1,e.shiftKey);else if(k==='arrowright')select(r,c+1,e.shiftKey);else if(k==='enter')select(r+1,c);else if(k==='tab'){e.preventDefault();select(r,c+1)}else if(k==='f2')editCell(r,c);else if(k==='delete'||k==='backspace'){e.preventDefault();clear('contents')}else if(k.length===1&&!e.altKey){editCell(r,c);let i=$('.editor');if(i){i.value=e.key;i.setSelectionRange(i.value.length,i.value.length);$('#formula').value=i.value}e.preventDefault()}});
window.addEventListener('error',e=>{console.error(e.error);toast('त्रुटि: '+e.message)});
Object.keys(FN_INFO).forEach(n=>$('#functions').insertAdjacentHTML('beforeend',`<option value="=${n}(">${FN_INFO[n][1]}</option>`));
function boot(){try{localStorage.removeItem('excelProWorkbook')}catch(e){console.warn('Storage cleanup unavailable',e)}ROWS=100;COLS=26;wb={name:'Workbook1',sheets:[blankSheet()],active:0,gridlines:true,theme:'light',zoom:100,protected:false,gridRows:100,gridCols:26};history=[];future=[];clip=null;dirty=false;selection={r1:0,c1:0,r2:0,c2:0};anchor={r:0,c:0};buildTabs();$('#filename').value=wb.name;applyTheme();initEngine();renderSheets();renderGrid()}boot();
})();
</script>
